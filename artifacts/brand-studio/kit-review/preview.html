<script>
const rotor=document.getElementById('rotor'),order=document.getElementById('order'),status=document.getElementById('status'),media=matchMedia('(prefers-reduced-motion: reduce)');
let logo,revision=0;
function mount(value){rotor.replaceChildren();const state=new CubeLogic.CubeState(value),animator=new CubeRendering.CubeAnimator(rotor,state);logo=new CubeLogoSystem.CubeLogo({state,animator,...EvaBrand.tokens.motion.modes[value===3?'deep':'normal'],onChange:s=>{status.textContent=(s.paused?'Paused · ':'')+s.stage+(s.move?' · '+s.index+'/'+s.total+' · '+s.move:'');}});logo.setReducedMotion(media.matches);if(document.hidden)logo.pause('hidden');document.getElementById('play').disabled=media.matches;}
function report(error){status.textContent='操作未完成 / '+error.message;}
order.addEventListener('change',async()=>{const wanted=Number(order.value),current=++revision;try{await logo.solve();if(current===revision)mount(wanted);}catch(error){report(error);}});
document.getElementById('play').addEventListener('click',()=>logo.play({loop:true}).catch(report));
document.getElementById('solve').addEventListener('click',()=>logo.solve().catch(report));
document.addEventListener('visibilitychange',()=>document.hidden?logo.pause('hidden'):logo.resume('hidden'));
media.addEventListener('change',()=>{document.getElementById('play').disabled=media.matches;logo.setReducedMotion(media.matches).catch(report);});
order.value='2';mount(2);
</script></html>
