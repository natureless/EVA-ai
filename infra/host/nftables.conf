#!/usr/sbin/nft -f
# EVA-VM 宿主网络策略
# 最外层网络边界。VM 内部还有自己的网络控制。
#
# 应用此文件：nft -f /etc/nftables.conf
# 开机自动加载：systemctl enable nftables

flush ruleset

table inet eva-host {

    # ── 入站链：只允许 SSH 和 EVA Dashboard ──────────────
    chain input {
        type filter hook input priority 0; policy drop;

        # 允许本地回环
        iif lo accept

        # 允许已建立/相关的连接
        ct state established,related accept

        # SSH 管理 (仅内网)
        ip saddr 192.168.0.0/16 tcp dport 22 accept

        # EVA Dashboard (仅内网)
        ip saddr 192.168.0.0/16 tcp dport 8000 accept

        # ICMP (ping 诊断)
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # 拒绝并记录其他入站
        log prefix "eva-host-input-deny: " counter drop
    }

    # ── 转发链：控制 VM 出站 ──────────────────────────────
    chain forward {
        type filter hook forward priority 0; policy drop;

        # 允许 VM 出站到允许的目标
        ip saddr 192.168.122.0/24 ip daddr { 1.1.1.1, 8.8.8.8 } udp dport 53 accept  # DNS

        # 允许 VM 出站 HTTP/HTTPS（仅白名单域名的 IP 在运行时更新）
        ip saddr 192.168.122.0/24 tcp dport { 80, 443 } accept

        # 允许 VM 回程流量
        ct state established,related accept

        log prefix "eva-host-fwd-deny: " counter drop
    }

    # ── 速率限制链 ────────────────────────────────────────
    chain rate-limit {
        # VM 出站速率限制
        ip saddr 192.168.122.0/24 tcp dport 443 limit rate over 100/minute \
            log prefix "eva-rate-limit: " counter drop
    }
}
