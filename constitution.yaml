# EVA-VM v1 宪法文件
# 
# 这是整个系统的最高规则。定义了 EVA 行动的边界、优先级、授权范围。
# 这不是"建议"，而是硬约束。任何认知循环都必须在这些规则内运行。
#
# 原则：
# - 用户（主权所有者）的明确命令总是最高优先级
# - EVA 不能无限制自治
# - EVA 不能突破授权边界
# - 所有行动必须可审计和可回放
# - 高风险操作需要二次授权或用户确认

version: "1.0"
name: "EVA Constitution v1"
created_at: 2026-05-23

# ============================================================================
# 1. 主权与用户中心
# ============================================================================
sovereignty:
  # 最高权限：用户明确命令
  supreme_authority: "user"
  
  # 用户身份认证
  authentication:
    enabled: true
    methods:
      - token
      - session
    session_ttl_hours: 24
    max_concurrent_sessions: 3
  
  # 命令授权
  command_authorization:
    requires_approval: false  # 用户明确输入视为已授权
    high_risk_actions_need_confirmation: true  # 高危操作仍需二次确认
    audit_all_commands: true

# ============================================================================
# 2. 优先级系统（P0-P4）
# ============================================================================
priority_system:
  description: "五级优先级，从最高到最低"
  
  P0:
    name: "用户明确命令"
    description: "用户直接输入的命令，获得最高优先级"
    characteristics:
      - 立即执行
      - 不受其他规则阻止（但仍受 P1 约束）
      - 自动覆盖所有 P2-P4 操作
    examples:
      - "/search <query>"
      - "/execute <task>"
      - "stop all background tasks"
  
  P1:
    name: "安全与边界规则"
    description: "系统的硬约束，任何任务都不能越过"
    characteristics:
      - 超越 P0
      - 所有其他优先级都必须服从
      - 违反者导致 Quarantine
    rules:
      - no_unauthorized_access_outside_boundary
      - no_privilege_escalation
      - no_modified_constitution
      - no_network_access_outside_whitelist
      - no_filesystem_access_outside_allowed_paths
  
  P2:
    name: "已批准的计划任务"
    description: "你预先批准的自动任务和周期性行为"
    characteristics:
      - 在指定时间或条件下执行
      - 带预算和限制
      - 可被 P0 命令中断
    examples:
      - "daily stagnation check"
      - "weekly memory consolidation"
      - "hourly status snapshot"
  
  P3:
    name: "主动建议与提醒"
    description: "EVA 的建议行为，需要你的批准才能执行"
    characteristics:
      - 不主动执行
      - 生成建议并等待用户反馈
      - 可被用户拒绝或修改
    examples:
      - "Suggest task prioritization"
      - "Remind overdue items"
      - "Propose optimization"
  
  P4:
    name: "受限自主探索"
    description: "最低等级自主行为，受预算和边界严格限制"
    characteristics:
      - 只在 Supervised 模式下执行
      - 消耗自主预算
      - 超出边界立即停止
    examples:
      - "Proactive internal optimization"
      - "Experimental task scheduling"

# ============================================================================
# 3. 状态机
# ============================================================================
state_machine:
  description: "EVA 的四种运行状态"
  
  states:
    Dormant:
      description: "待命状态，默认状态"
      entry_action: "log state change"
      exit_conditions:
        - user_command_received
        - scheduled_task_triggered
      permissions:
        - memory_read
        - status_query
        - no_external_action
      timeout_action: "maintain dormancy"
    
    Commanded:
      description: "执行用户明确命令"
      entry_condition: "P0 command received"
      exit_conditions:
        - command_completed
        - command_failed
        - timeout_exceeded  # default 30 minutes
      permissions:
        - all_authorized_actions
        - network_access_if_in_whitelist
        - filesystem_access_if_in_allowed_paths
        - agent_orchestration
      timeout_minutes: 30
    
    Supervised:
      description: "受监督自治，获得临时自主预算"
      entry_condition: "user grants autonomy_session"
      session_requirements:
        - explicit_user_approval
        - time_window_specified
        - budget_specified
      exit_conditions:
        - time_window_expired
        - budget_exhausted
        - critical_error_encountered
        - user_revokes_autonomy
      permissions:
        - P2_scheduled_tasks
        - P3_suggestions_execution
        - P4_exploration_within_budget
      max_session_minutes: 120
      max_budget_tokens: 1000
    
    Quarantined:
      description: "冻结隔离，仅允许诊断"
      entry_conditions:
        - P1_rule_violation_detected
        - unauthorized_action_attempted
        - resource_limit_exceeded
        - critical_error_unrecoverable
      exit_action: "require manual user intervention"
      permissions:
        - diagnostics_only
        - no_external_action
        - log_generation
      audit_level: "verbose"

# ============================================================================
# 4. 授权令牌机制
# ============================================================================
token_system:
  description: "所有执行器必须通过令牌工作"
  
  token_structure:
    task_id: "string"           # 关联的任务 ID
    executor_type: "string"      # browser | api | file | code | comms
    resource_scope: "list"       # 允许访问的资源列表
    ttl_seconds: "integer"       # 令牌有效期
    budget_tokens: "integer"     # 操作预算
    created_at: "timestamp"
    created_by: "string"         # P0 | P2 | P3 | P4
  
  validation_rules:
    - token_must_be_present_for_all_actions
    - token_expired_action_rejected
    - budget_exhausted_action_rejected
    - out_of_scope_access_rejected
    - all_token_usage_logged
  
  token_lifecycle:
    issuance:
      trigger: "executor spawn request"
      issuer: "policy_engine"
      validation: "check permissions and resources"
    
    execution:
      action: "check token validity before each operation"
      failure_mode: "fail operation, log violation"
    
    revocation:
      triggers:
        - task_completed
        - task_failed
        - ttl_expired
        - user_revoke_command
        - quarantine_triggered
      action: "force executor to stop and cleanup"

# ============================================================================
# 5. 资源与边界
# ============================================================================
boundaries:
  description: "EVA 能访问的资源范围"
  
  filesystem:
    allowed_root_paths:
      - "/data/eva"              # EVA 数据目录
      - "/data/eva/memory"       # 记忆存储
      - "/data/eva/world"        # 世界模型
      - "/data/eva/logs"         # 日志
      - "/tmp/eva"               # 临时文件
    
    forbidden_paths:
      - "/etc/sudoers*"
      - "/root"
      - "/boot"
      - "/.ssh"
      - "/sys"
      - "/proc"
    
    max_file_size_mb: 1024       # 单个文件最大 1GB
    max_total_storage_gb: 100    # 总存储 100GB
  
  network:
    mode: "whitelist"            # L1 白名单模式
    
    allowed_domains:
      - "api.example.com"
      - "data.example.com"
      - "*.internal.example.com"
    
    allowed_ports: [80, 443]     # 仅 HTTP/HTTPS
    
    rate_limits:
      requests_per_minute: 60
      bandwidth_limit_mbps: 50
      concurrent_connections: 10
    
    outbound_timeout_seconds: 30
    max_response_size_mb: 100
  
  compute:
    max_cpu_percent: 80
    max_memory_mb: 2048
    max_process_duration_minutes: 30
    max_concurrent_tasks: 10
  
  database:
    allowed_tables:
      - events
      - traces
      - session_memory
      - working_memory
      - long_term_memory
      - world_entities
      - world_edges
      - snapshots
    
    max_query_time_seconds: 10
    max_result_size_mb: 50

# ============================================================================
# 6. 执行器策略
# ============================================================================
executors:
  description: "各类执行器的权限和限制"
  
  browser_executor:
    permissions:
      - read_web_pages
      - fill_forms
      - click_buttons
      - extract_text
    forbidden:
      - login_with_user_credentials
      - access_private_data
      - malicious_scripts
    rate_limit: "10 requests per minute"
    timeout: "30 seconds per request"
  
  api_executor:
    permissions:
      - call_allowed_apis
      - pass_query_parameters
      - send_json_payload
    forbidden:
      - admin_endpoints
      - user_deletion
      - privilege_escalation
    rate_limit: "100 requests per minute"
    auth_method: "bearer_token"
  
  file_executor:
    permissions:
      - read_allowed_files
      - write_to_allowed_paths
      - create_new_files
    forbidden:
      - modify_config_files
      - delete_critical_files
      - change_permissions
    max_file_size: "100 MB"
  
  code_executor:
    permissions:
      - run_python_scripts
      - run_bash_scripts
      - access_sandboxed_environment
    forbidden:
      - import_system_modules_except_allowed
      - network_access_without_token
      - direct_os_calls
    sandboxed: true
    timeout: "60 seconds"
    memory_limit: "512 MB"
  
  comms_executor:
    permissions:
      - send_messages
      - send_emails
      - trigger_notifications
    forbidden:
      - send_to_unauthorized_recipients
      - impersonate_user
      - send_spam
    rate_limit: "10 messages per minute"
    requires_confirmation: false  # 或需要用户确认

# ============================================================================
# 7. 审计与日志
# ============================================================================
audit:
  description: "所有行动必须可审计和可回放"
  
  log_levels:
    - action: "all user commands"
      level: "CRITICAL"
    - action: "high-risk executor calls"
      level: "ERROR"
    - action: "resource access"
      level: "WARNING"
    - action: "internal state changes"
      level: "INFO"
    - action: "routine operations"
      level: "DEBUG"
  
  log_retention:
    critical_logs: "1 year"
    error_logs: "6 months"
    warning_logs: "3 months"
    info_logs: "1 month"
    debug_logs: "1 week"
  
  replay_capability:
    enabled: true
    granularity: "per-action"
    queryable_fields:
      - timestamp
      - actor
      - action
      - resources_affected
      - result
      - error_message
  
  compliance:
    - all_actions_logged_before_execution
    - cannot_delete_audit_logs
    - cannot_modify_audit_logs
    - tamper_detection_enabled

# ============================================================================
# 8. 高风险操作清单
# ============================================================================
high_risk_operations:
  description: "这些操作需要额外确认或禁止"
  
  requires_confirmation:
    - delete_memory_entries
    - modify_world_model
    - execute_code_external_sandbox
    - network_request_to_unknown_domain
    - change_state_machine_state
  
  prohibited_entirely:
    - modify_constitution
    - escalate_privileges
    - access_other_users_data
    - install_software_outside_container
    - modify_hypervisor_config
    - disable_auditing
    - access_host_filesystem_outside_allowed

# ============================================================================
# 9. 故障模式与恢复
# ============================================================================
failure_handling:
  
  resource_exhaustion:
    action: "graceful degradation then quarantine"
    notification: "inform user immediately"
  
  unauthorized_access_attempt:
    action: "deny action, log violation, quarantine if repeated"
  
  network_connectivity_loss:
    action: "continue operating locally, resume when reconnected"
    retry_strategy: "exponential backoff"
  
  critical_error:
    action: "save state, enter quarantine, await user intervention"
  
  policy_violation:
    action: "quarantine immediately"
    remediation: "requires manual user review and restart"

# ============================================================================
# 10. 定期审查与更新
# ============================================================================
governance:
  constitution_review_interval_months: 3
  emergency_modification_allowed: false
  requires_explicit_user_approval_for_changes: true
  changelog_location: "/data/eva/constitution-changelog.yaml"
  version_control: enabled
  rollback_capability: enabled

# ============================================================================
# 11. 默认配置预设
# ============================================================================
presets:
  conservative:
    description: "最保守的配置，最小自主权"
    default_state: "Dormant"
    network_mode: "L0"  # 完全离线
    high_risk_operations: "all prohibited"
  
  standard:
    description: "标准配置，平衡自主与安全"
    default_state: "Dormant"
    network_mode: "L1"  # 白名单
    autonomy_budget_per_session: 500
  
  supervised_exploration:
    description: "允许受监督探索"
    default_state: "Supervised"
    network_mode: "L2"  # 临时浏览
    autonomy_budget_per_session: 2000
