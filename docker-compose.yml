version: '3.8'

# EVA-VM v1 Docker Compose
# Single-container deployment — bootstrap.py initializes all subsystems:
#   cognition loop, scheduler, memory store, audit log, executor framework

services:
  eva:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eva
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./constitution.yaml:/app/constitution.yaml:ro
    environment:
      EVA_ENV: production
      EVA_DB_PATH: /app/data/eva.db
      EVA_LOG_LEVEL: INFO
      EVA_HOST: 0.0.0.0
      EVA_PORT: 8000
      # Uncomment to enable API authentication:
      # EVA_API_TOKEN: ${EVA_API_TOKEN:-}
      # Uncomment for real LLM (otherwise uses mock):
      # DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # For parallel event processing, set to 2-4:
      # EVA_COGNITION_WORKER_COUNT: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      eva.component: "core"
      eva.description: "EVA cognitive agent host — all-in-one"
