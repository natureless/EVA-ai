# EVA-MVSC Production Docker Compose
# Includes MVSC pipeline support via EVA_ENABLE_MVSC_PIPELINE flag

services:
  eva:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eva
    ports:
      - "${EVA_PORT:-8000}:8000"
    volumes:
      # Persistent data — bind mount for production
      - eva_data:/app/data
      - eva_logs:/app/logs
      # Configuration — read-only
      - ./config:/app/config:ro
      - ./constitution.yaml:/app/constitution.yaml:ro
      - ./configs:/app/configs:ro
    environment:
      # Core
      EVA_ENV: production
      EVA_HOST: 0.0.0.0
      EVA_PORT: 8000
      EVA_LOG_LEVEL: ${EVA_LOG_LEVEL:-INFO}
      EVA_DB_PATH: /app/data/eva.db

      # MVSC Pipeline — set "true" to enable
      EVA_ENABLE_MVSC_PIPELINE: ${EVA_ENABLE_MVSC_PIPELINE:-false}
      EVA_MVSC_SUBJECT_ID: ${EVA_MVSC_SUBJECT_ID:-eva-prod-001}

      # Ablation preset — only used when MVSC is enabled
      # Options: baseline, no_broadcast, no_self_model, minimal, resource_limited
      EVA_ABLATION_PRESET: ${EVA_ABLATION_PRESET:-baseline}

      # LLM — uncomment and set via .env or environment
      # DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Production refuses to start without API authentication.
      EVA_API_TOKEN: ${EVA_API_TOKEN:?Set EVA_API_TOKEN before starting EVA}

      # High-risk LLM tools are disabled unless explicitly enabled.
      EVA_ENABLE_CODE_TOOL: ${EVA_ENABLE_CODE_TOOL:-false}
      EVA_ENABLE_NETWORK_TOOLS: ${EVA_ENABLE_NETWORK_TOOLS:-false}
      EVA_TRUST_PROXY_HEADERS: ${EVA_TRUST_PROXY_HEADERS:-false}

      # Parallelism. Keep the API itself single-process until an external bus lands.
      EVA_COGNITION_WORKER_COUNT: ${EVA_COGNITION_WORKER_COUNT:-2}
      EVA_AGENT_WORKER_COUNT: ${EVA_AGENT_WORKER_COUNT:-4}
      EVA_AGENT_EXECUTION_TIMEOUT_SEC: ${EVA_AGENT_EXECUTION_TIMEOUT_SEC:-120}

      # Storage backend — postgresql for multi-instance
      EVA_STORAGE_BACKEND: ${EVA_STORAGE_BACKEND:-sqlite}

      # Timing tuning
      EVA_SCHEDULER_TICK_INTERVAL_SEC: 10
      EVA_SCHEDULER_SNAPSHOT_INTERVAL_SEC: 120
      EVA_STAGNATION_THRESHOLD_SEC: 86400
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; r=urllib.request.urlopen('http://localhost:8000/health/ready'); d=json.loads(r.read()); exit(0 if d['status']=='ready' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      eva.component: "core"
      eva.version: "v0.2-mvsc"
      eva.description: "EVA cognitive agent host with MVSC pipeline"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  eva_data:
    driver: local
  eva_logs:
    driver: local
