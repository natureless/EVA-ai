<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVA-MVSC Dashboard</title>
<style>
:root{--bg:#0d1117;--fg:#c9d1d9;--accent:#58a6ff;--border:#30363d;--card:#161b22;--green:#3fb950;--red:#f85149;--yellow:#d2991d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);padding:20px}
h1{font-size:20px;margin-bottom:16px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
.card h2{font-size:14px;color:var(--accent);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.stat{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid var(--border)}
.stat:last-child{border-bottom:none}
.stat .val{font-weight:600;font-family:monospace}
.val.green{color:var(--green)}.val.red{color:var(--red)}.val.yellow{color:var(--yellow)}
#pipeline{grid-column:1/-1}
.phase-bar{display:flex;gap:2px;margin-top:8px}
.phase{flex:1;height:6px;border-radius:3px;background:var(--border);transition:background 0.3s}
.phase.active{background:var(--accent)}
.phase.done{background:var(--green)}
#log{grid-column:1/-1;max-height:200px;overflow-y:auto;font-family:monospace;font-size:12px}
.log-entry{padding:2px 0;border-bottom:1px solid var(--border)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.ok{background:var(--green)}.status-dot.warn{background:var(--yellow)}.status-dot.err{background:var(--red)}
</style>
</head>
<body>
<h1>⚙️ EVA-MVSC Dashboard</h1>
<div class="grid">
  <div class="card">
    <h2>🧠 Cognition</h2>
    <div class="stat"><span>Tick</span><span class="val" id="tick">—</span></div>
    <div class="stat"><span>Phase</span><span class="val" id="phase">—</span></div>
    <div class="stat"><span>Mode</span><span class="val" id="mode">—</span></div>
    <div class="stat"><span>Focus</span><span class="val" id="focus" style="font-size:11px">—</span></div>
  </div>
  <div class="card">
    <h2>📊 Pipeline (13 phases)</h2>
    <div class="phase-bar" id="phaseBar"></div>
    <div class="stat"><span>Last Phase Timing</span><span class="val" id="phaseTime">—</span></div>
  </div>
  <div class="card">
    <h2>💓 Health</h2>
    <div class="stat"><span>Status</span><span class="val" id="status">—</span></div>
    <div class="stat"><span>DB</span><span class="val" id="db">—</span></div>
    <div class="stat"><span>Loop</span><span class="val" id="loop">—</span></div>
    <div class="stat"><span>Scheduler</span><span class="val" id="sched">—</span></div>
  </div>
  <div class="card">
    <h2>🔬 Ablation</h2>
    <div class="stat"><span>MVSC Enabled</span><span class="val" id="mvscOn">—</span></div>
    <div class="stat"><span>Features Disabled</span><span class="val" id="disabled">—</span></div>
    <div class="stat"><span>Error Rate</span><span class="val" id="errRate">—</span></div>
  </div>
  <div class="card" id="log">
    <h2>📜 Event Log</h2>
    <div id="logEntries"></div>
  </div>
</div>
<script>
const PHASES = ['perceive','update_world','update_body','generate_content','select_attention','broadcast','attribute_self','evaluate','decide','plan','act','verify','consolidate'];
const MAX_LOG = 50;
let phaseIdx = -1;

// Build phase bar
const bar = document.getElementById('phaseBar');
PHASES.forEach(p => {const d=document.createElement('div');d.className='phase';d.title=p;bar.appendChild(d)});

function addLog(msg, cls=''){
  const entries = document.getElementById('logEntries');
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `<span class="status-dot ${cls}"></span>${new Date().toLocaleTimeString()} ${msg}`;
  entries.insertBefore(div, entries.firstChild);
  while(entries.children.length > MAX_LOG) entries.removeChild(entries.lastChild);
}

// WS: MVSC pipeline phases
const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${protocol}//${location.host}/ws?channel=mvsc_phase`);

ws.onmessage = (e) => {
  try {
    const {channel, payload} = JSON.parse(e.data);
    if (channel === 'mvsc_phase') {
      document.getElementById('tick').textContent = payload.tick;
      document.getElementById('phase').textContent = payload.phase;
      document.getElementById('mode').textContent = payload.mode;
      document.getElementById('phaseTime').textContent = (payload.timing_ms||0).toFixed(1) + 'ms';

      // Update phase bar
      const idx = PHASES.indexOf(payload.phase);
      if (idx >= 0) {
        document.querySelectorAll('.phase').forEach((d,i) => {
          d.className = 'phase ' + (i < idx ? 'done' : i === idx ? 'active' : '');
        });
        phaseIdx = idx;
      }

      if (payload.phase === 'consolidate') addLog(`Tick ${payload.tick} complete`, 'ok');
    }
  } catch(ex) {}
};

// Periodic state poll
async function pollState() {
  try {
    const r = await fetch('/api/state');
    const s = await r.json();
    document.getElementById('focus').textContent = (s.focus||'idle').substring(0,60);
    document.getElementById('mvscOn').textContent = s.mvsc?.enabled ? '✅' : '❌';
    document.getElementById('mvscOn').className = 'val ' + (s.mvsc?.enabled ? 'green' : 'yellow');
  } catch(ex) {}

  try {
    const r = await fetch('/health/ready');
    const h = await r.json();
    document.getElementById('status').textContent = h.status;
    document.getElementById('status').className = 'val ' + (h.status==='ready'?'green':'red');
    const c = h.components||{};
    document.getElementById('db').textContent = c.db ? '✅' : '❌';
    document.getElementById('db').className = 'val ' + (c.db?'green':'red');
    document.getElementById('loop').textContent = c.cognition_loop ? '✅' : '❌';
    document.getElementById('loop').className = 'val ' + (c.cognition_loop?'green':'red');
    document.getElementById('sched').textContent = c.scheduler ? '✅' : '❌';
    document.getElementById('sched').className = 'val ' + (c.scheduler?'green':'red');

    if (h.mvsc) {
      document.getElementById('mvscOn').textContent = h.mvsc.enabled ? '✅' : '❌';
    }
  } catch(ex) {}

  try {
    const r = await fetch('/api/mvsc/ablation');
    const a = await r.json();
    if (a.features) {
      const disabled = Object.entries(a.features).filter(([k,v])=>!v).map(([k])=>k);
      document.getElementById('disabled').textContent = disabled.length ? disabled.join(', ') : 'none';
    }
  } catch(ex) {}
}

setInterval(pollState, 2000);
pollState();
addLog('Dashboard connected', 'ok');
</script>
</body>
</html>
