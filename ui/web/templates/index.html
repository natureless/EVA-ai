<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ app_name }} · Chat</title>
  <link rel="stylesheet" href="/static/main.css?v=5" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1>{{ app_name }} <span class="ver">v0.1</span></h1>
      <span class="sub" id="avatarStateLabel" data-i18n="avatar.idle">EVA 已就绪</span>
    </div>
    <div class="topbar-right">
      <span id="wsIndicator" class="badge disconnected">WS</span>
      <a href="/settings" class="icon-btn" data-i18n-title="nav.settings" title="设置">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </a>
      <button id="langBtn" class="lang-btn" title="Switch Language / 切换语言">中</button>
      <button id="themeBtn" class="icon-btn" data-i18n-title="btn.theme" title="切换深色/浅色模式">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2m-10-10h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <div class="chat-page">
    <!-- Avatar panel -->
    <div class="avatar-panel" id="avatarPanel">
      <canvas class="avatar-particle-canvas" id="particleCanvas"></canvas>
    </div>

    <!-- Chat panel -->
    <div class="chat-panel">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty" id="chatEmpty">
          <p data-i18n="chat.emptyState">开始与 EVA 对话</p>
        </div>
      </div>
      <div class="chat-input-area">
        <form class="chat-form" id="chatForm">
          <div class="chat-input-row">
            <textarea id="chatInput" data-i18n-placeholder="chat.inputHint" placeholder="输入消息..." rows="2"></textarea>
            <button type="submit" class="send-btn" id="sendBtn" data-i18n="chat.send">发送</button>
          </div>
          <div class="chat-toolbar">
            <div class="toggle-row">
              <label class="toggle-switch"><input type="checkbox" id="streamToggle" checked><span class="slider"></span></label>
              <span data-i18n="chat.sse">SSE 流式</span>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/i18n.js"></script>
  <script src="/static/nav.js"></script>
  <script src="/static/avatar.js?v=5"></script>
  <script src="/static/chat.js?v=7"></script>
</body>
</html>
